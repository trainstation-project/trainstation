exclude: 'build'

# datastation/framework is a fork of datatrove (Apache-2.0, formatted with ruff).
# The hooks that rewrite files or enforce trainstation style skip it, so it stays
# comparable with upstream and keeps its license headers and data assets as-is.
# The ruff hooks at the end of this file check it instead.

default_language_version:
    python: python3

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 6306a48f7dae5861702d573c9c247e4e9498e867
    hooks:
    -   id: trailing-whitespace
        exclude: '^datastation/framework/'
    -   id: check-ast
    -   id: check-merge-conflict
    -   id: no-commit-to-branch
        args: ['--branch=main']
    -   id: check-added-large-files
        args: ['--maxkb=500']
        # datastation's uv lockfile, and the URL blocklist that datatrove's
        # URLFilter loads at runtime.
        exclude: '^datastation/(uv\.lock|framework/src/datatrove/assets/url_filterblacklistsv0_3_0\.tar\.gz)$'
    -   id: end-of-file-fixer
        exclude: '^(.*\.svg|datastation/framework/.*)$'

-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
    -   id: insert-license
        files: \.py$
        exclude: '^datastation/framework/'
        args:
        - --license-filepath
        - assets/license_header.txt

-   repo: https://github.com/pycqa/flake8
    rev: 34cbf8ef3950f43d09b85e2e45c15ae5717dc37b
    hooks:
    -   id: flake8
        additional_dependencies:
          - flake8-bugbear == 22.4.25
          - pep8-naming == 0.12.1
          - torchfix
          - flake8-pep585
          - flake8-new-union-types == 0.4.1
        args: ['--config=.flake8']
        exclude: '^datastation/framework/'

-   repo: https://github.com/omnilib/ufmt
    rev: v2.3.0
    hooks:
    -   id: ufmt
        exclude: '^datastation/framework/'
        additional_dependencies:
          - black == 22.12.0
          - usort == 1.0.5

- repo: https://github.com/jsh9/pydoclint
  rev: d88180a8632bb1602a4d81344085cf320f288c5a
  hooks:
    - id: pydoclint
      args: [--config=pyproject.toml]
      exclude: '^datastation/framework/'

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
    - id: codespell
      name: codespell
      description: Checks for common misspellings in text files.
      entry: codespell --toml pyproject.toml
      language: python
      types: [text]
      exclude: '^datastation/framework/'
      additional_dependencies:
        - tomli

- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 0.45.1
  hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false
      language: system
      args: ["--remove-unused-ignores", "--summarize-errors"]


- repo: local
  hooks:
    # Check hyperlinks and external links
    - id: lychee-link-checker
      name: lychee-link-checker
      language: system
      entry: |
        /bin/bash -c '
        mkdir -p /tmp/lychee 2>/dev/null
        SENTINEL_DIR="/tmp/lychee/lychee_lock_${PPID}"
        if ! command -v lychee >/dev/null 2>&1; then
            # mkdir is atomic; only one process will succeed in creating it
            if mkdir "$SENTINEL_DIR" 2>/dev/null; then
                {
                  echo "--------------------------------------------------------"
                  echo "Warning: Lychee (link checker) not found. Skipping ... "
                  echo ""
                  echo "To enable local link checking, install Lychee:"
                  echo "  - MacOS: brew install lychee"
                  echo "  - Linux/Windows: https://github.com/lycheeverse/lychee"
                  echo "--------------------------------------------------------"
                } > /dev/tty 2>/dev/null || true
            fi
            exit 0
        fi
        lychee "$@"
        ' --
      args:
        - "--quiet"
        - "--no-progress"
        - "--cache"
        - "--exclude-path=(^|/)\\.[^/]+/"
        - "--root-dir=."
        - "--accept=100..399,400,401,402,403,405..999" # Fail only on 404
        - "--exclude=http://localhost:.*"
        - "--exclude=http://127.0.0.1:.*"
        - "--exclude=tcp://localhost:.*"
        - "--max-retries=5"
        - "--retry-wait-time=10"
        - "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
      types_or: [markdown, python]
      exclude: '^datastation/framework/'

# datastation/framework (datatrove fork): ruff with the [tool.ruff] config in
# datastation/framework/pyproject.toml. Keep rev in sync with datastation/uv.lock.
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.11
  hooks:
    - id: ruff-check
      args: [--fix]
      files: '^datastation/framework/'
    - id: ruff-format
      files: '^datastation/framework/'
